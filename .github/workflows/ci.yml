name: Test, Build and Verify Booking
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: noubatyar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U test -d noubatyar_test"
          --health-interval=3s --health-timeout=3s --health-retries=20
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/noubatyar_test
      DIRECT_URL: postgresql://test:test@127.0.0.1:5432/noubatyar_test
      SESSION_SECRET: CI_ONLY_DO_NOT_USE_IN_PRODUCTION_SUPER_LONG_KEY_12345
      CI_INTEGRATION: 'true'
      CRON_SECRET: CI_ONLY_CRON_SECRET_32_BYTES_MINIMUM
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No package-lock is distributed yet; npm ci/cache cannot be used before it is generated.
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
      - run: npm run db:generate
      - run: npx prisma db push
      - run: npm run db:constraints
      - run: npm run lint
      - run: npm run test:core
      - run: npm test
      - run: npm run test:db
      - run: npm run build
