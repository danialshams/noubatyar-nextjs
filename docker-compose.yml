services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noubatyar
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: noubatyar
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U noubatyar -d noubatyar"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://noubatyar:${DB_PASSWORD}@db:5432/noubatyar?schema=public
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
volumes:
  pgdata:
